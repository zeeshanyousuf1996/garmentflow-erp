<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · GarmentFlow</title><link rel="stylesheet" href="../assets/style.css"><style>
body{background:#f5f6f8}.main{margin:0!important}.signin-wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:30px}.signin-card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:32px;box-shadow:0 8px 30px #0000000a}.signin-card h1{font-size:26px;margin:8px 0}.signin-card .form-grid{display:grid;grid-template-columns:1fr;gap:14px}.signin-card input{width:100%;box-sizing:border-box}.brandmark{font-weight:700;font-size:20px;color:#26364b}.brandmark span{color:#1672c4}.signin-btn{width:100%;margin-top:18px}.small-link{font-size:13px;color:#1769aa;text-decoration:none}.signin-foot{margin-top:18px;font-size:12px;color:#667085}
</style></head><body><main class="main"><header class="top"><b>GarmentFlow ERP</b><span>Customer demo environment</span></header><div class="signin-wrap"><section class="signin-card"><div class="brandmark">Garment<span>Flow</span> ERP</div><h1>Sign in</h1><p class="muted">Sign in to continue to your workspace selection.</p><form id="signin"><div class="form-grid"><label>Email address<input id="email" type="email" required placeholder="name@company.com"></label><label>Password<input id="password" type="password" required placeholder="Demo password"></label></div><button class="btn signin-btn">Sign in & continue</button><p id="msg" class="signup-msg"></p></form><p><a class="small-link" href="signup.html">Create a demo account →</a></p><div class="signin-foot">Demo only · Credentials are not securely authenticated.</div></section></div></main><script>
document.getElementById('signin').onsubmit=e=>{e.preventDefault();let users=JSON.parse(localStorage.getItem('gf-demo-users')||'[]');let u=users.find(x=>x.email.toLowerCase()===email.value.toLowerCase());if(!u){u={name:email.value.split('@')[0],email:email.value,company:'GarmentFlow Demo',role:'Administrator',modules:['Dashboard','Sales','Inventory & Procurement','Production','Finance','HR','Reports','Settings']};users.push(u);localStorage.setItem('gf-demo-users',JSON.stringify(users));}localStorage.setItem('gf-demo-access',JSON.stringify(u.modules||[]));localStorage.setItem('gf-demo-current-user',JSON.stringify(u));location.href='module-selection.html'};
</script></body></html>
